name = "hydransva"
compatibility_date = "2025-06-01"
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"

# Radar archive (12 h, shared by every device). Create the namespace once in the Cloudflare dashboard:
# Storage & Databases → KV → Create namespace "hydra-radar", then paste its ID below.
[[kv_namespaces]]
binding = "RADAR"
id = "798ff9bc12b847f580b73e186a0a7bf6"

[triggers]
crons = ["*/10 * * * *"]

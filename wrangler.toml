name = "hydransva"
compatibility_date = "2025-06-01"
main = "worker.js"

# Bara public/ publiceras som statiska filer (tidigare "." vilket även exponerade worker.js och wrangler.toml).
[assets]
directory = "public"
binding = "ASSETS"

# Radararkiv (12 h, delas av alla skärmar). Namespace "hydra-radar".
# ID:t ska alltid stå kvar här.
[[kv_namespaces]]
binding = "RADAR"
id = "798ff9bc12b847f580b73e186a0a7bf6"

[triggers]
crons = ["*/10 * * * *"]
